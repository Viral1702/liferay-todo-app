version: "3.8"

services:

  # ── MySQL 8 ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: liferay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lportal
      MYSQL_USER: viral
      MYSQL_PASSWORD: viral
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Init scripts run once on first DB creation
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "viral", "-pviral"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Liferay (built from local Dockerfile) ───────────────────────────────────
  liferay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liferay-portal
    depends_on:
      mysql:
        condition: service_healthy   # wait for MySQL to be ready
    ports:
      - "8080:8080"
      - "11311:11311"               # Gogo Shell (remove in production)
    environment:
      LIFERAY_JVM_OPTS: "-Xms1536m -Xmx2048m -XX:MaxMetaspaceSize=384m"
      # Allow access by IP when running on a remote server — add your EC2 IP here
      LIFERAY_VIRTUAL_PERIOD_HOSTS_PERIOD_VALID_PERIOD_HOSTS: "localhost,127.0.0.1,3.250.70.195"
    volumes:
      - liferay_data:/opt/liferay/data
    restart: unless-stopped

volumes:
  mysql_data:
  liferay_data:
