version: "3.8"

services:
  # ── Liferay Application Server ──────────────────────────────────────────────
  liferay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liferay-portal
    ports:
      - "8080:8080"
      - "11311:11311"
    environment:
      # FIX: Added -Dexternal-properties to point to an empty/non-existent path to bypass the bad file injection
      LIFERAY_JVM_OPTS: "-Xms1536m -Xmx3072m -XX:MaxMetaspaceSize=1024m -Dexternal-properties=portal-setup-wizard.properties"
      
      # Standard direct environment mappings for database connection configuration
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: "com.mysql.cj.jdbc.Driver"
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: "jdbc:mysql://liferay-database.clmi8oqio7oo.eu-west-1.rds.amazonaws.com:3306/lportal?useUnicode=true&characterEncoding=UTF-8&useFastDateParsing=false&sslMode=REQUIRED"
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME: "root"
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD: "YOUR_PASSWORD" 
      
      LIFERAY_VIRTUAL_PERIOD_HOSTS_PERIOD_VALID_PERIOD_HOSTS: "*"
    volumes:
      - liferay_data:/opt/liferay/data
      - ./certs:/opt/liferay/certs:ro
      - ./configs/docker/osgi/configs:/mnt/liferay/files/osgi/configs:ro
    restart: unless-stopped

volumes:
  liferay_data:
